<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">EMI sniffer system overview</title>
  <desc id="desc">Signal path from a 120 volt AC circuit through a protected analog front end, high-speed ADC, XIAO ESP32-S3 acquisition, FFT analysis, and MQTT remote monitoring.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#405466"/>
    </marker>
    <style>
      .label { font: 600 15px sans-serif; fill: #17212b; text-anchor: middle; }
      .detail { font: 13px sans-serif; fill: #405466; text-anchor: middle; }
      .box { stroke: #405466; stroke-width: 2; rx: 12; }
      .arrow { stroke: #405466; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="960" height="300" fill="#f7f9fb"/>
  <text x="480" y="36" class="label" font-size="19">XIAO ESP32-S3 EMI sniffer signal path</text>

  <rect x="30" y="105" width="125" height="90" class="box" fill="#e8f1f4"/>
  <text x="92" y="137" class="label">120 V AC</text>
  <text x="92" y="160" class="detail">mains circuit</text>
  <text x="92" y="180" class="detail">noise source</text>

  <rect x="190" y="90" width="155" height="120" class="box" fill="#fff1d6"/>
  <text x="267" y="125" class="label">Protected</text>
  <text x="267" y="147" class="label">analog front end</text>
  <text x="267" y="174" class="detail">coupling + protection</text>
  <text x="267" y="192" class="detail">attenuation</text>

  <rect x="380" y="105" width="125" height="90" class="box" fill="#e8f1f4"/>
  <text x="442" y="137" class="label">High-speed</text>
  <text x="442" y="159" class="label">ADC</text>
  <text x="442" y="182" class="detail">sampled signal</text>

  <rect x="540" y="90" width="155" height="120" class="box" fill="#dcefe7"/>
  <text x="617" y="125" class="label">XIAO</text>
  <text x="617" y="147" class="label">ESP32-S3</text>
  <text x="617" y="174" class="detail">data acquisition</text>
  <text x="617" y="192" class="detail">data transport</text>

  <rect x="730" y="90" width="95" height="120" class="box" fill="#eee8f7"/>
  <text x="777" y="126" class="label">FFT</text>
  <text x="777" y="148" class="label">analysis</text>
  <text x="777" y="176" class="detail">frequency</text>
  <text x="777" y="194" class="detail">bands</text>

  <rect x="860" y="90" width="70" height="120" class="box" fill="#f7e4e2"/>
  <text x="895" y="126" class="label">MQTT</text>
  <text x="895" y="153" class="detail">remote</text>
  <text x="895" y="171" class="detail">monitoring</text>
  <text x="895" y="189" class="detail">and data</text>
  <text x="895" y="207" class="detail">collection</text>

  <path d="M155 150 H190" class="arrow"/>
  <path d="M345 150 H380" class="arrow"/>
  <path d="M505 150 H540" class="arrow"/>
  <path d="M695 150 H730" class="arrow"/>
  <path d="M825 150 H860" class="arrow"/>

  <text x="480" y="255" class="detail">Captured data can be correlated over time with appliance and power-supply activity.</text>
</svg>
