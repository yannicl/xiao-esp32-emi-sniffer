<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">AC front-end protection, capacitive divider, and transformer coupling</title>
  <desc id="desc">A fused and MOV-protected mains input drives a series capacitive divider. Its midpoint feeds the primary of an isolated transformer through a 47 ohm resistor. The secondary has a 100 ohm parallel load and feeds a 1 kiloohm series resistor before the RF input.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel-mains { fill: #fff7ed; stroke: #f97316; stroke-width: 2; }
      .panel-safe { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .wire { fill: none; stroke: #172033; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: #64748b; stroke-width: 2; stroke-linecap: round; }
      .component { fill: #ffffff; stroke: #172033; stroke-width: 3; }
      .accent { fill: #fed7aa; stroke: #c2410c; stroke-width: 3; }
      .safety { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 3; }
      .label { fill: #172033; font-family: sans-serif; font-size: 21px; }
      .small { fill: #475569; font-family: sans-serif; font-size: 17px; }
      .bold { font-weight: 700; }
      .domain { fill: #9a3412; font-family: sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
      .domain-safe { fill: #1d4ed8; font-family: sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
      .node { fill: #172033; }
      .isolation { stroke: #2563eb; stroke-width: 3; stroke-dasharray: 10 9; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="650"/>
  <rect class="panel-mains" x="28" y="30" width="720" height="570" rx="14"/>
  <rect class="panel-safe" x="780" y="30" width="392" height="570" rx="14"/>

  <text class="domain" x="55" y="70">MAINS / HIGH-VOLTAGE DOMAIN</text>
  <text class="domain-safe" x="810" y="70">ISOLATED SENSING</text>
  <text class="small" x="55" y="98">Protection and reduced-voltage coupling</text>
  <text class="small" x="810" y="98">Secondary signal path</text>

  <!-- Mains rails and input -->
  <text class="label bold" x="52" y="155">L</text>
  <text class="label bold" x="52" y="515">N</text>
  <path class="wire" d="M78 150 H145"/>
  <path class="wire" d="M78 510 H690"/>

  <!-- Fuse -->
  <rect class="component" x="145" y="132" width="120" height="36" rx="4"/>
  <path class="wire" d="M158 150 H252"/>
  <text class="label bold" x="169" y="125">Fuse</text>
  <path class="wire" d="M265 150 H690"/>
  <circle class="node" cx="290" cy="150" r="6"/>
  <text class="small" x="300" y="142">protected L</text>

  <!-- MOV -->
  <path class="wire" d="M290 150 V215"/>
  <polygon class="accent" points="273,218 310,233 286,300 249,285"/>
  <path class="wire" d="M290 303 V510"/>
  <text class="label bold" x="325" y="250">Varistor</text>
  <text class="small" x="325" y="275">430 V</text>
  <text class="small" x="325" y="297">surge clamp</text>
  <circle class="node" cx="290" cy="510" r="6"/>

  <!-- Capacitive divider -->
  <path class="wire" d="M445 150 V222"/>
  <rect class="safety" x="417" y="222" width="56" height="48" rx="5"/>
  <text class="label bold" x="431" y="252">C1</text>
  <text class="small" x="480" y="251">47 nF X2</text>
  <path class="wire" d="M445 270 V325"/>
  <circle class="node" cx="445" cy="325" r="7"/>
  <path class="wire" d="M445 325 V380"/>
  <rect class="safety" x="417" y="380" width="56" height="48" rx="5"/>
  <text class="label bold" x="431" y="410">C2</text>
  <text class="small" x="480" y="409">47 nF X2</text>
  <path class="wire" d="M445 428 V510"/>
  <path class="thin" d="M445 325 H520" marker-end="url(#arrow)"/>
  <text class="small" x="455" y="365">divider midpoint</text>

  <!-- RS1 and primary -->
  <path class="wire" d="M520 325 H555"/>
  <rect class="component" x="555" y="307" width="90" height="36" rx="4"/>
  <path class="wire" d="M570 325 H630"/>
  <text class="label bold" x="575" y="299">R 47 Ω</text>
  <path class="wire" d="M645 325 H670"/>

  <!-- Transformer primary -->
  <path class="wire" d="M670 325 H690"/>
  <path class="wire" d="M690 510 H670"/>
  <path class="wire" d="M690 325 C720 325 720 350 690 350 C660 350 660 375 690 375 C720 375 720 400 690 400 C660 400 660 425 690 425 C720 425 720 450 690 450 C660 450 660 475 690 475 C720 475 720 510 690 510"/>
  <text class="label bold" x="620" y="550">Primary</text>

  <!-- Isolation barrier -->
  <path class="isolation" d="M760 115 V270"/>
  <path class="isolation" d="M760 520 V580"/>
  <text class="domain-safe" x="965" y="590" text-anchor="middle" transform="rotate(-90 765 590)">GALVANIC ISOLATION</text>

  <!-- Secondary, parallel termination, and series output resistor -->
  <path class="wire" d="M815 325 C845 325 845 350 815 350 C785 350 785 375 815 375 C845 375 845 400 815 400 C785 400 785 425 815 425 C845 425 845 450 815 450 C785 450 785 475 815 475 C845 475 845 510 815 510"/>
  <path class="wire" d="M815 325 H930"/>
  <path class="wire" d="M815 510 H930"/>
  <text class="label bold" x="800" y="550">Secondary</text>

  <!-- RB is connected directly across the complete secondary winding -->
  <path class="wire" d="M900 325 V382"/>
  <rect class="component" x="880" y="382" width="40" height="70" rx="4"/>
  <path class="wire" d="M900 452 V510"/>
  <text class="label bold" x="925" y="408">RB (Burden Resistor)</text>
  <text class="small" x="925" y="432">100 Ω</text>

  <!-- RS is in series after the secondary/RB node -->
  <path class="wire" d="M930 325 H945"/>
  <rect class="component" x="945" y="307" width="82" height="36" rx="4"/>
  <path class="wire" d="M960 325 H1012"/>
  <text class="label bold" x="962" y="299">RS 1 kΩ</text>
  <path class="wire" d="M1027 325 H1145"/>
  <rect class="safety" x="1070" y="300" width="92" height="50" rx="5"/>
  <text class="label bold" x="1100" y="331">RF</text>
  <text class="small" x="1070" y="370">RF input</text>

  <!-- Explanatory callouts -->
  <path class="thin" d="M110 570 H340"/>
  <text class="small" x="110" y="590">Fuse clears sustained faults</text>
  
</svg>
