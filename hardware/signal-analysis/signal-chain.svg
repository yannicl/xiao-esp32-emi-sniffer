<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-labelledby="title desc">
  <title id="title">EMI sniffer analog signal chain</title>
  <desc id="desc">Signal path from mains EMI coupling through protection and attenuation, an OPA365AIDR buffer, the ADS7049-Q1 analog-to-digital converter, and the ESP32-S3. A separate MCP1700T-3302E/TT regulator provides a 3.3 volt analog rail to the amplifier and converter.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 Z" fill="#405466"/>
    </marker>
    <style>
      .stage { stroke: #405466; stroke-width: 2; rx: 12; }
      .name { font: 600 16px sans-serif; fill: #17212b; text-anchor: middle; }
      .detail { font: 13px sans-serif; fill: #405466; text-anchor: middle; }
      .arrow { fill: none; stroke: #405466; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="900" height="220" fill="#f7f9fb"/>
  <text x="450" y="30" class="name" font-size="19">EMI sniffer signal chain</text>

  <rect x="25" y="75" width="155" height="85" class="stage" fill="#e8f1f4"/>
  <text x="102" y="108" class="name">Mains EMI</text>
  <text x="102" y="131" class="detail">coupling</text>
  <text x="102" y="150" class="detail">conducted noise</text>

  <rect x="215" y="75" width="165" height="85" class="stage" fill="#fff1d6"/>
  <text x="297" y="108" class="name">Protection</text>
  <text x="297" y="131" class="detail">and attenuation</text>
  <text x="297" y="150" class="detail">safe signal level</text>

  <rect x="415" y="75" width="150" height="85" class="stage" fill="#dcefe7"/>
  <text x="490" y="108" class="name">OPA365AIDR</text>
  <text x="490" y="131" class="detail">low-impedance</text>
  <text x="490" y="150" class="detail">ADC driver</text>

  <rect x="600" y="75" width="145" height="85" class="stage" fill="#eee8f7"/>
  <text x="672" y="108" class="name">ADS7049-Q1</text>
  <text x="672" y="131" class="detail">12-bit ADC</text>
  <text x="672" y="150" class="detail">SPI + DMA</text>

  <rect x="780" y="75" width="95" height="85" class="stage" fill="#f7e4e2"/>
  <text x="827" y="108" class="name">ESP32-S3</text>
  <text x="827" y="131" class="detail">sampling</text>
  <text x="827" y="150" class="detail">and FFT</text>

  <path d="M180 117 H215" class="arrow"/>
  <path d="M380 117 H415" class="arrow"/>
  <path d="M565 117 H600" class="arrow"/>
  <path d="M745 117 H780" class="arrow"/>

  <rect x="420" y="175" width="350" height="28" class="stage" fill="#e4edf7"/>
  <text x="600" y="194" class="detail">MCP1700T-3302E/TT: regulated 3.3 V analog rail</text>
  <path d="M490 175 V160" class="arrow"/>
  <path d="M672 175 V160" class="arrow"/>
</svg>
